services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assesswatch-service
    volumes:
      - .:/var/www
    networks:
      - internal-ecosystem
    env_file:
      - .env.docker
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "9001:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - internal-ecosystem
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  internal-ecosystem:
      external: true
